site_name: China Trademark Registration · Nice Classification
site_description: >-
  How to register a trademark in China: costs, timelines, class strategy and squatters.
  Plus the full Nice Classification for China in Chinese and English — 45 classes,
  495 sub-classes and 32,665 goods and services items, as CSV and JSON.
# Served from the main site under /guide/ (baota nginx, static files).
# The GitHub Pages deployment keeps building with the same canonical, so the
# mirror can never outrank or duplicate china-trademark.net.
site_url: https://china-trademark.net/guide/
repo_url: https://github.com/mycntm/china-trademark-registration-guide
repo_name: mycntm/china-trademark-registration-guide
# Staged by scripts/build-docs.py: the original guides/, classification/ and
# data/ stay in the repository root and are copied in, untouched.
docs_dir: .build/docs
copyright: Text and data licensed CC BY 4.0 · Maintained by MY CNTM (china-trademark.net)

# Static .html URLs (not /page/) so that relative links such as ../data/x.csv
# resolve correctly from every page. Do not change without rewriting those links.
use_directory_urls: false

theme:
  name: material
  language: en
  # No Google Fonts request: the CSS defines a system font stack instead.
  font: false
  # Colours come from docs/assets/stylesheets/extra.css
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.top
    - navigation.path
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tooltips

extra_css:
  - assets/stylesheets/extra.css

# Only does anything on the classification search page (it bails out when
# #tm-search is absent), so one file covers the whole site.
extra_javascript:
  - javascripts/classification-search.js

plugins:
  - search:
      lang: [en, zh]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

extra:
  generator: false

nav:
  - Home: index.md
  - Guides:
      - Overview: guides/index.md
      - How long does registration take: guides/01-how-long-does-china-trademark-registration-take.md
      - Cost and official fees: guides/02-china-trademark-cost-and-official-fees.md
      - Madrid vs direct filing: guides/03-madrid-protocol-vs-direct-cnipa-filing.md
      - "Squatters: recover your brand": guides/04-china-trademark-squatters-recover-your-brand.md
      - Nice classification guide: guides/05-nice-classification-guide-china.md
  - 45-class classification:
      - Search goods & services: classification/search.md
      - Overview and downloads: classification/index.md
      - Classes 01–14 · goods:
          - "Class 01 · 化学原料": classification/class-01-chemicals.md
          - "Class 02 · 颜料油漆": classification/class-02-paints.md
          - "Class 03 · 日化用品": classification/class-03-cosmetics-cleaning.md
          - "Class 04 · 燃料油脂": classification/class-04-lubricants-fuels.md
          - "Class 05 · 医药": classification/class-05-pharmaceuticals.md
          - "Class 06 · 金属材料": classification/class-06-metal.md
          - "Class 07 · 机械设备": classification/class-07-machinery.md
