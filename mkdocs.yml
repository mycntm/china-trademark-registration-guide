          - "Class 16 · 办公用品": classification/class-16-paper-goods-printed-matter.md
          - "Class 17 · 橡胶制品": classification/class-17-rubber-goods.md
          - "Class 18 · 皮革皮具": classification/class-18-leather-goods.md
          - "Class 19 · 建筑材料": classification/class-19-non-metallic-building-materials.md
